[package]
name = "yss-project"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[features]
test-support = ["yss-project-filesystem/test-support", "yss-project-identity/test-support"]

[dependencies]
yss-canonical-hash = { path = "../yss-canonical-hash" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
trash = "5.2"
uuid.workspace = true
yss-data-contract = { path = "../yss-data-contract" }
yss-database-contract = { path = "../yss-database-contract" }
yss-display-naming = { path = "../yss-display-naming" }
yss-dataset-store = { path = "../yss-dataset-store" }
yss-function-editor-projection = { path = "../yss-function-editor-projection" }
yss-graph-document = { path = "../yss-graph-document" }
yss-graph-document-edit = { path = "../yss-graph-document-edit" }
yss-graph-protocol = { path = "../yss-graph-protocol" }
yss-project-change = { path = "../yss-project-change" }
yss-project-filesystem = { path = "../yss-project-filesystem" }
yss-project-history = { path = "../yss-project-history" }
yss-project-identity = { path = "../yss-project-identity" }
yss-project-layout = { path = "../yss-project-layout" }
yss-project-model = { path = "../yss-project-model" }
yss-project-operation = { path = "../yss-project-operation" }
yss-resource-lifecycle = { path = "../yss-resource-lifecycle" }
yss-resource-naming = { path = "../yss-resource-naming" }
yss-chart-document = { path = "../yss-chart-document" }

[dev-dependencies]
yss-project-filesystem = { path = "../yss-project-filesystem", features = ["test-support"] }
yss-project-identity = { path = "../yss-project-identity", features = ["test-support"] }
