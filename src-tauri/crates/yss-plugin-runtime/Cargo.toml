[package]
name = "yss-plugin-runtime"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
yss-plugin-protocol = { path = "../yss-plugin-protocol" }
yss-plugin-sdk = { path = "../yss-plugin-sdk" }
yss-file-replace = { path = "../yss-file-replace" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
zip = { version = "6", default-features = false, features = ["deflate"] }
ed25519-dalek = "2.2"
serde_jcs = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
] }

[dev-dependencies]
arrow.workspace = true

[[test]]
name = "native_extension"
path = "../../../plugins/julia/tests/native_extension.rs"
