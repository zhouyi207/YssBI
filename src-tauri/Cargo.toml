[package]
name = "yssbi"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
  ".",
  "crates/yss-api",
  "crates/yss-application",
  "crates/yss-bayes-artifact-contract",
  "crates/yss-bayes-artifact-polars",
  "crates/yss-bayes-model",
  "crates/yss-bayes-result",
  "crates/yss-bayes-worker",
  "crates/yss-bayes-worker-julia",
  "crates/yss-canonical-hash",
  "crates/yss-computation-settings",
  "crates/yss-data-contract",
  "crates/yss-database-contract",
  "crates/yss-database-edit",
  "crates/yss-database-runtime",
  "crates/yss-database-schema",
  "crates/yss-dataset-profile",
  "crates/yss-diagnostics",
  "crates/yss-display-naming",
  "crates/yss-duckdb",
  "crates/yss-execution",
  "crates/yss-execution-sci-adapter",
  "crates/yss-function-editor-projection",
  "crates/yss-graph-analysis",
  "crates/yss-graph-analysis-contract",
  "crates/yss-graph-catalog",
  "crates/yss-graph-compiler",
  "crates/yss-graph-compiler-diagnostics",
  "crates/yss-graph-document",
  "crates/yss-graph-document-edit",
  "crates/yss-graph-editor",
  "crates/yss-graph-protocol",
  "crates/yss-graph-resource-contract",
  "crates/yss-graph-registry",
  "crates/yss-graph-runtime",
  "crates/yss-graph-type-mapping",
  "crates/yss-julia-runtime",
  "crates/yss-julia-worker",
  "crates/yss-math",
  "crates/yss-path-display",
  "crates/yss-project",
  "crates/yss-project-change",
  "crates/yss-project-discovery",
  "crates/yss-project-filesystem",
  "crates/yss-project-history",
  "crates/yss-project-identity",
  "crates/yss-project-layout",
  "crates/yss-project-manifest",
  "crates/yss-project-model",
  "crates/yss-project-operation",
  "crates/yss-project-progress",
  "crates/yss-project-registry",
  "crates/yss-project-registry-contract",
  "crates/yss-project-registry-sqlite",
  "crates/yss-project-watcher",
  "crates/yss-project-watcher-notify",
  "crates/yss-resource-lifecycle",
  "crates/yss-resource-naming",
  "crates/yss-sci",
  "crates/yss-sci-contract",
  "crates/yss-sci-runtime",
  "crates/yss-sql-source",
  "crates/yss-tabular-contract",
  "crates/yss-tabular-io",
  "crates/yss-tabular-polars",
  "crates/yss-tracing",
  "crates/yss-variable-contract",
  "crates/yss-variable-value",
  "crates/yss-window-state",
  "crates/yss-chart-document",
]

[workspace.package]
rust-version = "1.94"

[workspace.dependencies]
chrono = "0.4.41"
duckdb = { version = "1.10504.0", default-features = false, features = [
  "bundled",
  "appender-arrow",
] }
faer = "0.24.0"
mathlex = "=0.4.2"
ndarray = "0.17.2"
notify = "8.2.0"
num-traits = "0.2.19"
polars = { version = "0.53.0", default-features = false, features = [
  "lazy",
  "csv",
  "ipc",
  "parquet",
  "strings",
  "dtype-categorical",
  "dtype-date",
  "dtype-datetime",
  "dtype-duration",
  "dtype-time",
  "dtype-decimal",
  "dtype-i8",
  "dtype-i16",
  "dtype-u8",
  "dtype-u16",
] }
polars-arrow = { version = "0.53.0", default-features = false }
polars-dtype = { version = "0.53.0", features = ["dtype-categorical"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
statrs = { version = "0.19", default-features = false, features = ["std", "rand"] }
tauri = { version = "2.11", features = [] }
thiserror = "2.0.18"
regex = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "macros",
  "sqlite",
  "postgres",
  "mysql",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
unicode-normalization = "0.1.24"
unicode-casefold = "0.2.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
] }


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yssbi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yss-api = { path = "./crates/yss-api" }
yss-application = { path = "./crates/yss-application" }
yss-bayes-artifact-polars = { path = "./crates/yss-bayes-artifact-polars" }
yss-bayes-worker-julia = { path = "./crates/yss-bayes-worker-julia" }
yss-diagnostics = { path = "./crates/yss-diagnostics" }
yss-execution = { path = "./crates/yss-execution" }
yss-execution-sci-adapter = { path = "./crates/yss-execution-sci-adapter" }
yss-julia-worker = { path = "./crates/yss-julia-worker" }
yss-project = { path = "./crates/yss-project" }
yss-project-progress = { path = "./crates/yss-project-progress" }
yss-project-registry = { path = "./crates/yss-project-registry" }
yss-project-registry-sqlite = { path = "./crates/yss-project-registry-sqlite" }
yss-project-watcher = { path = "./crates/yss-project-watcher" }
yss-project-watcher-notify = { path = "./crates/yss-project-watcher-notify" }
yss-tracing = { path = "./crates/yss-tracing" }
yss-window-state = { path = "./crates/yss-window-state" }
tauri.workspace = true
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-clipboard-manager = "2"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
duckdb.workspace = true
polars.workspace = true
proc-macro2 = "1"
serde.workspace = true
serde_json.workspace = true
syn = { version = "3", features = ["full", "visit"] }
uuid.workspace = true
yss-bayes-model = { path = "./crates/yss-bayes-model" }
yss-database-contract = { path = "./crates/yss-database-contract" }
yss-database-edit = { path = "./crates/yss-database-edit" }
yss-database-runtime = { path = "./crates/yss-database-runtime" }
yss-duckdb = { path = "./crates/yss-duckdb" }
yss-project-identity = { path = "./crates/yss-project-identity" }
