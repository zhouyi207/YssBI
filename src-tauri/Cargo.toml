[package]
name = "yssbi"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
  ".",
  "crates/yss-plugin-protocol",
  "crates/yss-plugin-sdk",
  "crates/yss-plugin-runtime",
  "../plugins/julia/native/crates/yss-bayes-runtime",
  "../plugins/julia/native/crates/yss-julia-extension",
  "../plugins/julia/native/crates/yss-bayes-artifact-contract",
  "../plugins/julia/native/crates/yss-bayes-artifact-datafusion",
  "../plugins/julia/native/crates/yss-bayes-model",
  "../plugins/julia/native/crates/yss-bayes-result",
  "../plugins/julia/native/crates/yss-bayes-worker",
  "../plugins/julia/native/crates/yss-bayes-worker-julia",
  "../plugins/julia/native/crates/yss-julia-runtime",
  "../plugins/julia/native/crates/yss-julia-worker",

  "crates/yss-api",
  "crates/yss-agent-rig",
  "crates/yss-application",
  "crates/yss-automation-contract",
  "crates/yss-statistical-harness",
  "crates/yss-statistical-harness-sqlite",
  "crates/yss-canonical-hash",
  "crates/yss-data-contract",
  "crates/yss-datafusion",
  "crates/yss-relational-contract",
  "crates/yss-database-contract",
  "crates/yss-database-edit",
  "crates/yss-database-runtime",
  "crates/yss-database-schema",
  "crates/yss-dataset-profile",
  "crates/yss-dataset-store",
  "crates/yss-diagnostics",
  "crates/yss-display-naming",
  "crates/yss-execution",
  "crates/yss-file-replace",
  "crates/yss-function-editor-projection",
  "crates/yss-graph-analysis",
  "crates/yss-graph-analysis-contract",
  "crates/yss-graph-catalog",
  "crates/yss-graph-compiler",
  "crates/yss-graph-compiler-diagnostics",
  "crates/yss-graph-document",
  "crates/yss-graph-document-edit",
  "crates/yss-graph-editor",
  "crates/yss-graph-protocol",
  "crates/yss-graph-resource-contract",
  "crates/yss-graph-registry",
  "crates/yss-graph-runtime",
  "crates/yss-graph-type-mapping",
  "crates/yss-linalg",
  "crates/yss-math-expr",
  "crates/yss-path-display",
  "crates/yss-project",
  "crates/yss-project-change",
  "crates/yss-project-discovery",
  "crates/yss-project-filesystem",
  "crates/yss-project-history",
  "crates/yss-project-identity",
  "crates/yss-project-layout",
  "crates/yss-project-model",
  "crates/yss-project-operation",
  "crates/yss-project-progress",
  "crates/yss-project-registry",
  "crates/yss-project-registry-contract",
  "crates/yss-project-registry-sqlite",
  "crates/yss-project-watcher",
  "crates/yss-project-watcher-notify",
  "crates/yss-resource-lifecycle",
  "crates/yss-resource-naming",
  "crates/yss-sci",
  "crates/yss-sci-contract",
  "crates/yss-sci-runtime",
  "crates/yss-sql-source",
  "crates/yss-tabular-contract",
  "crates/yss-tabular-arrow",
  "crates/yss-tabular-io",
  "crates/yss-tracing",
  "crates/yss-window-state",
  "crates/yss-chart-document",
]

[workspace.package]
rust-version = "1.94"

[workspace.dependencies]
semver = "1"
arrow-array = "=59.3.0"
futures-core = "0.3"
futures-util = "0.3"
url = "2.5"
arrow = { version = "=59.3.0", default-features = false, features = ["ipc", "csv", "chrono-tz"] }
arrow-schema = { version = "=59.3.0", features = ["serde"] }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap", "zstd"] }
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "sql", "datetime_expressions", "string_expressions", "unicode_expressions"] }
chrono = "0.4.41"
mathlex = "=0.4.2"
ndarray = "0.17.2"
notify = "8.2.0"
num-traits = "0.2.19"
rand = "0.10"
rig-agent = { version = "=0.42.0", default-features = false }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
sha2 = "0.10.9"
statrs = { version = "0.19", default-features = false, features = ["std", "rand"] }
tauri = { version = "2.11", features = [] }
thiserror = "2.0.18"
regex = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "macros",
  "sqlite",
  "postgres",
  "mysql",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
unicode-normalization = "0.1.24"
unicode-casefold = "0.2.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
] }


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yssbi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yss-plugin-protocol = { path = "./crates/yss-plugin-protocol" }
yss-plugin-runtime = { path = "./crates/yss-plugin-runtime" }
yss-sci-contract = { path = "./crates/yss-sci-contract" }
yss-sci-runtime = { path = "./crates/yss-sci-runtime" }
yss-api = { path = "./crates/yss-api" }
yss-agent-rig = { path = "./crates/yss-agent-rig" }
yss-application = { path = "./crates/yss-application" }
yss-automation-contract = { path = "./crates/yss-automation-contract" }
yss-diagnostics = { path = "./crates/yss-diagnostics" }
yss-execution = { path = "./crates/yss-execution" }
yss-project = { path = "./crates/yss-project" }
yss-project-identity = { path = "./crates/yss-project-identity" }
yss-project-progress = { path = "./crates/yss-project-progress" }
yss-project-registry = { path = "./crates/yss-project-registry" }
yss-project-registry-sqlite = { path = "./crates/yss-project-registry-sqlite" }
yss-project-watcher = { path = "./crates/yss-project-watcher" }
yss-project-watcher-notify = { path = "./crates/yss-project-watcher-notify" }
yss-statistical-harness = { path = "./crates/yss-statistical-harness" }
yss-statistical-harness-sqlite = { path = "./crates/yss-statistical-harness-sqlite" }
yss-tracing = { path = "./crates/yss-tracing" }
yss-window-state = { path = "./crates/yss-window-state" }
tauri.workspace = true
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-clipboard-manager = "2"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
yss-dataset-store = { path = "./crates/yss-dataset-store" }
yss-relational-contract = { path = "./crates/yss-relational-contract" }
arrow.workspace = true
yss-tabular-io = { path = "./crates/yss-tabular-io" }
proc-macro2 = "1"
serde.workspace = true
serde_json.workspace = true
syn = { version = "3", features = ["full", "visit"] }
uuid.workspace = true
yss-database-contract = { path = "./crates/yss-database-contract" }
yss-database-edit = { path = "./crates/yss-database-edit" }
yss-database-runtime = { path = "./crates/yss-database-runtime", features = ["test-support"] }
