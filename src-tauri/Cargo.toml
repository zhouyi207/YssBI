[package]
name = "yssbi"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    ".",
    "crates/yss-application",
    "crates/yss-bayes-artifact-contract",
    "crates/yss-bayes-model",
    "crates/yss-bayes-result",
    "crates/yss-bayes-worker",
    "crates/yss-bayes-worker-julia",
    "crates/yss-canonical-hash",
    "crates/yss-computation-settings",
    "crates/yss-data-contract",
    "crates/yss-database-contract",
    "crates/yss-database-edit",
    "crates/yss-database-runtime",
    "crates/yss-database-schema",
    "crates/yss-dataset-profile",
    "crates/yss-diagnostics",
    "crates/yss-display-naming",
    "crates/yss-duckdb",
    "crates/yss-execution",
    "crates/yss-function-editor-projection",
    "crates/yss-graph-analysis",
    "crates/yss-graph-analysis-contract",
    "crates/yss-graph-catalog",
    "crates/yss-graph-compiler",
    "crates/yss-graph-compiler-diagnostics",
    "crates/yss-graph-document",
    "crates/yss-graph-document-edit",
    "crates/yss-graph-editor",
    "crates/yss-graph-protocol",
    "crates/yss-graph-resource-contract",
    "crates/yss-graph-registry",
    "crates/yss-graph-runtime",
    "crates/yss-graph-type-mapping",
    "crates/yss-julia-runtime",
    "crates/yss-julia-worker",
    "crates/yss-math",
    "crates/yss-path-display",
    "crates/yss-project",
    "crates/yss-project-change",
    "crates/yss-project-discovery",
    "crates/yss-project-filesystem",
    "crates/yss-project-history",
    "crates/yss-project-identity",
    "crates/yss-project-layout",
    "crates/yss-project-manifest",
    "crates/yss-project-model",
    "crates/yss-project-operation",
    "crates/yss-project-progress",
    "crates/yss-project-registry",
    "crates/yss-project-registry-contract",
    "crates/yss-project-registry-sqlite",
    "crates/yss-project-watcher",
    "crates/yss-project-watcher-notify",
    "crates/yss-resource-lifecycle",
    "crates/yss-resource-naming",
    "crates/yss-sci",
    "crates/yss-sci-contract",
    "crates/yss-sci-runtime",
    "crates/yss-sql-source",
    "crates/yss-tabular-contract",
    "crates/yss-tabular-io",
    "crates/yss-tabular-polars",
    "crates/yss-tracing",
    "crates/yss-variable-contract",
    "crates/yss-variable-value",
    "crates/yss-window-state",
    "crates/yss-worksheet-document",
]

[workspace.package]
rust-version = "1.94"

[workspace.dependencies]
chrono = "0.4.41"
duckdb = { version = "1.10504.0", default-features = false, features = ["bundled", "appender-arrow"] }
faer = "0.24.0"
mathlex = "=0.4.2"
ndarray = "0.17.2"
notify = "8.2.0"
num-traits = "0.2.19"
polars = { version = "0.53.0", default-features = false, features = ["lazy", "csv", "ipc", "parquet", "strings", "dtype-categorical", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time", "dtype-decimal", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
polars-arrow = { version = "0.53.0", default-features = false }
polars-dtype = { version = "0.53.0", features = ["dtype-categorical"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
statrs = { version = "0.19", default-features = false, features = ["std", "rand"] }
tauri = { version = "2.11", features = [] }
thiserror = "2.0.18"
regex = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "sqlite", "postgres", "mysql"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
unicode-normalization = "0.1.24"
unicode-casefold = "0.2.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yssbi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yss-application = { path = "./crates/yss-application" }
yss-bayes-artifact-contract = { path = "./crates/yss-bayes-artifact-contract" }
yss-bayes-model = { path = "./crates/yss-bayes-model" }
yss-bayes-result = { path = "./crates/yss-bayes-result" }
yss-bayes-worker-julia = { path = "./crates/yss-bayes-worker-julia" }
yss-computation-settings = { path = "./crates/yss-computation-settings" }
yss-data-contract = { path = "./crates/yss-data-contract" }
yss-database-contract = { path = "./crates/yss-database-contract" }
yss-database-edit = { path = "./crates/yss-database-edit" }
yss-database-runtime = { path = "./crates/yss-database-runtime" }
yss-database-schema = { path = "./crates/yss-database-schema" }
yss-diagnostics = { path = "./crates/yss-diagnostics" }
yss-duckdb = { path = "./crates/yss-duckdb" }
yss-execution = { path = "./crates/yss-execution" }
yss-function-editor-projection = { path = "./crates/yss-function-editor-projection" }
yss-graph-analysis = { path = "./crates/yss-graph-analysis" }
yss-graph-analysis-contract = { path = "./crates/yss-graph-analysis-contract" }
yss-graph-catalog = { path = "./crates/yss-graph-catalog" }
yss-graph-document = { path = "./crates/yss-graph-document" }
yss-graph-document-edit = { path = "./crates/yss-graph-document-edit" }
yss-graph-editor = { path = "./crates/yss-graph-editor" }
yss-graph-protocol = { path = "./crates/yss-graph-protocol" }
yss-graph-registry = { path = "./crates/yss-graph-registry" }
yss-graph-runtime = { path = "./crates/yss-graph-runtime" }
yss-julia-runtime = { path = "./crates/yss-julia-runtime" }
yss-julia-worker = { path = "./crates/yss-julia-worker" }
yss-math = { path = "./crates/yss-math" }
yss-project = { path = "./crates/yss-project" }
yss-project-filesystem = { path = "./crates/yss-project-filesystem" }
yss-project-history = { path = "./crates/yss-project-history" }
yss-project-identity = { path = "./crates/yss-project-identity" }
yss-project-layout = { path = "./crates/yss-project-layout" }
yss-project-model = { path = "./crates/yss-project-model" }
yss-project-progress = { path = "./crates/yss-project-progress" }
yss-project-registry = { path = "./crates/yss-project-registry" }
yss-project-registry-contract = { path = "./crates/yss-project-registry-contract" }
yss-project-registry-sqlite = { path = "./crates/yss-project-registry-sqlite" }
yss-project-watcher = { path = "./crates/yss-project-watcher" }
yss-project-watcher-notify = { path = "./crates/yss-project-watcher-notify" }
yss-sci-contract = { path = "./crates/yss-sci-contract" }
yss-sci-runtime = { path = "./crates/yss-sci-runtime" }
yss-tabular-contract = { path = "./crates/yss-tabular-contract" }
yss-tabular-io = { path = "./crates/yss-tabular-io" }
yss-tracing = { path = "./crates/yss-tracing" }
yss-variable-contract = { path = "./crates/yss-variable-contract" }
yss-window-state = { path = "./crates/yss-window-state" }
yss-worksheet-document = { path = "./crates/yss-worksheet-document" }
tauri.workspace = true
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-clipboard-manager = "2"


serde.workspace = true
serde_json.workspace = true
polars.workspace = true
chrono.workspace = true


uuid.workspace = true
thiserror.workspace = true
duckdb.workspace = true
tracing.workspace = true

[dev-dependencies]
proc-macro2 = "1"
sqlx.workspace = true
syn = { version = "3", features = ["full", "visit"] }
tracing-subscriber.workspace = true
yss-execution = { path = "./crates/yss-execution", features = ["test-support"] }
yss-graph-catalog = { path = "./crates/yss-graph-catalog", features = ["test-support"] }
yss-graph-runtime = { path = "./crates/yss-graph-runtime", features = ["test-support"] }
yss-project-filesystem = { path = "./crates/yss-project-filesystem", features = ["test-support"] }
yss-project-identity = { path = "./crates/yss-project-identity", features = ["test-support"] }
yss-project = { path = "./crates/yss-project", features = ["test-support"] }
yss-application = { path = "./crates/yss-application", features = ["test-support"] }
