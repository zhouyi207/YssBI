[package]
name = "yss-harness-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = [
  "dep:yss-harness-tantivy",
  "dep:yss-project-identity",
  "yss-harness-contract/test-support",
]

[dependencies]
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
yss-harness-contract = { path = "../yss-harness-contract" }
yss-canonical-hash = { path = "../yss-canonical-hash" }
yss-harness-tantivy = { path = "../yss-harness-tantivy", optional = true }
yss-project-identity = { path = "../yss-project-identity", optional = true }

[dev-dependencies]
yss-harness-contract = { path = "../yss-harness-contract", features = ["test-support"] }
yss-harness-tantivy = { path = "../yss-harness-tantivy" }
yss-project-identity = { path = "../yss-project-identity" }
