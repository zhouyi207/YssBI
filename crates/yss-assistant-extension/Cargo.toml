[package]
name = "yss-assistant-extension"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = []

[dependencies]
hex.workspace = true
schemars.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
yss-assistant-contract = { path = "../yss-assistant-contract" }
yss-canonical-hash = { path = "../yss-canonical-hash" }
yss-harness-contract = { path = "../yss-harness-contract" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
yss-harness-core = { path = "../yss-harness-core", features = ["test-support"] }
yss-harness-tantivy = { path = "../yss-harness-tantivy" }
yss-project-identity = { path = "../yss-project-identity" }
