[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/yss-desktop-gpui"]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "=0.7.3", features = [
  "gpui-fast",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
dunce = "1.0.5"
atomicwrites = { version = "=0.4.4", default-features = false }
libc = "0.2"
semver = "1"
arrow-array = "=59.3.0"
arrow-select = "=59.3.0"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4.3"
lru = { version = "0.18.5", default-features = false }
url = "2.5"
arrow = { version = "=59.3.0", default-features = false, features = ["ipc", "csv", "chrono-tz"] }
arrow-schema = { version = "=59.3.0", features = ["serde"] }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap", "zstd"] }
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "sql", "datetime_expressions", "string_expressions", "unicode_expressions", "nested_expressions"] }
chrono = "0.4.41"
mathlex = "=0.4.2"
faer = "0.24.0"
notify = "8.2.0"
walkdir = "2.5.0"
num-traits = "0.2.19"
libm = "0.2.16"
rand = "0.10"
rig-agent = { version = "=0.43.0", default-features = false }
rig-core = { version = "=0.43.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "=0.43.0", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "=4.2.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
schemars = "=1.2.2"
jsonschema = { version = "=0.58.6", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["lz4-compression"] }
sha2 = "0.10.9"
statrs = { version = "0.19", default-features = false, features = ["std", "rand"] }
thiserror = "2.0.18"
regex = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "macros",
  "sqlite",
  "postgres",
  "mysql",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
unicode-normalization = "0.1.24"
unicode-casefold = "0.2.0"
pinyin_pro = { version = "=3.29.4", default-features = false }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
] }

# Keep interactive rendering usable in `cargo run` without optimizing business crates.
[profile.dev.package.yss-desktop-gpui]
opt-level = 1

[profile.dev.package.yss-workbench]
opt-level = 1

[profile.dev.package.yss-ui]
opt-level = 1

[profile.dev.package.yss-graph-ui]
opt-level = 1

[profile.dev.package.yss-assistant-ui]
opt-level = 1

[profile.dev.package.yss-data-ui]
opt-level = 1

[profile.dev.package.yss-results-ui]
opt-level = 1

[profile.dev.package.yss-settings-ui]
opt-level = 1

[profile.dev.package.yss-resource-ui]
opt-level = 1

[profile.dev.package.yss-plugin-ui]
opt-level = 1

[profile.dev.package.gpui-fast]
opt-level = 2

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.gpui-fast-wgpu]
opt-level = 2

# New WGPU windows compile shaders synchronously through Naga.
[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

# Text layout runs synchronously during prepaint: Editor soft wrap shapes every
# line of a document, and CJK font fallback rebuilds shaping plans per run.
# Unoptimized, opening a 27 KB Chinese Markdown file stalled one frame for 3.5 s.
[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-linebreak]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.ropey]
opt-level = 2

[profile.dev.package.gpui-pre-sum-tree]
opt-level = 2

# Markdown documents and chat messages up to 4 KB parse on the UI thread, with
# formulas typeset and code highlighted as part of that parse.
[profile.dev.package.markdown]
opt-level = 2

[profile.dev.package.ratex-parser]
opt-level = 2

[profile.dev.package.ratex-layout]
opt-level = 2

[profile.dev.package.ratex-svg]
opt-level = 2

[profile.dev.package.tree-sitter]
opt-level = 2

[profile.dev.package.tree-sitter-md]
opt-level = 2

# Icons and formulas rasterize on first paint at each size.
[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2
