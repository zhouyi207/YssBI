name: Check native platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  check:
    name: Check (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up build tools
        uses: ./.github/actions/setup-build
        with:
          target: ${{ inputs.target }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Run focused portable unit tests
        run: cargo test --locked -p yss-resource-naming -p yss-project-layout -p yss-canonical-hash --lib
      - name: Test installed resource discovery
        run: cargo test --locked -p yss-installation-paths --lib
      - name: Check bundled sample catalog
        if: runner.os == 'Linux'
        run: cargo run --locked -p yss-application --example build_samples -- --check
      - name: Test packaging scripts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
