name: Release packages

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      reuse-ci: ${{ steps.ci.outputs.reuse-ci }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release tag and version
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Workspace version is not a release version')
          if os.environ['GITHUB_REF'] != f'refs/tags/app-v{version}':
              raise SystemExit('Run this workflow from the tag matching the workspace version: app-v' + version)
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/gpui'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PY
      - name: Find successful same-commit CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_ci.py

  linux:
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux
      version: ${{ needs.preflight.outputs.version }}
      reuse-ci: ${{ needs.preflight.outputs.reuse-ci == 'true' }}
      check-runner: ubuntu-24.04
      check-target: x86_64-unknown-linux-gnu
      targets: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","arch":"x86_64"},
         {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","arch":"aarch64"}]

  macos:
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos
      version: ${{ needs.preflight.outputs.version }}
      reuse-ci: ${{ needs.preflight.outputs.reuse-ci == 'true' }}
      check-runner: macos-15
      check-target: aarch64-apple-darwin
      targets: >-
        [{"runner":"macos-15-intel","target":"x86_64-apple-darwin","arch":"x86_64"},
         {"runner":"macos-15","target":"aarch64-apple-darwin","arch":"aarch64"}]

  windows:
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: windows
      version: ${{ needs.preflight.outputs.version }}
      reuse-ci: ${{ needs.preflight.outputs.reuse-ci == 'true' }}
      check-runner: windows-2022
      check-target: x86_64-pc-windows-msvc
      targets: >-
        [{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","arch":"x86_64"},
         {"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","arch":"aarch64"}]


  publish:
    name: Create complete draft release
    needs: [preflight, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download all successful platform assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Validate complete release and create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tomllib, urllib.error, urllib.parse, urllib.request
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          tag = f'app-v{version}'
          if version != os.environ['PACKAGE_VERSION'] or os.environ['GITHUB_REF'] != f'refs/tags/{tag}':
              raise SystemExit('Release tag and workspace version disagree')
          directory = pathlib.Path('dist')
          bundles = {
              f'yssbi-{version}-{platform}-{arch}.{extension}'
              for platform, extensions in {'linux': ['tar.gz', 'rpm'], 'macos': ['dmg'], 'windows': ['exe', 'zip']}.items()
              for arch in ('x86_64', 'aarch64')
              for extension in extensions
          }
          bundles |= {
              f'yssbi-{version}-ubuntu24.04-{arch}.deb'
              for arch in ('x86_64', 'aarch64')
          }
          expected = bundles | {name + '.sha256' for name in bundles}
          actual = {path.name for path in directory.iterdir()}
          if actual != expected:
              raise SystemExit(f'Incomplete release: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}')
          checksums = []
          for name in sorted(bundles):
              path = directory / name
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit('Invalid release asset: ' + name)
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              line = f'{digest}  {name}'
              if (directory / (name + '.sha256')).read_text(encoding='utf-8').strip() != line:
                  raise SystemExit('Checksum mismatch: ' + name)
              checksums.append(line)
          (directory / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          expected.add('SHA256SUMS')
          api = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers | {'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)
          # Refuse existing drafts too: reruns must not overwrite somebody's reviewed assets.
          page = 1
          while True:
              releases = request(f'{api}/releases?per_page=100&page={page}')
              if any(release['tag_name'] == tag for release in releases):
                  raise SystemExit('A release already exists for this tag; refusing to overwrite it')
              if len(releases) < 100:
                  break
              page += 1
          note = '**Unsigned build:** Windows executables are not Authenticode signed; macOS bundles use certificate-free ad-hoc signing and are not notarized. OS security warnings are expected.'
          release = request(api + '/releases', 'POST', {
              'tag_name': tag, 'name': 'YssBI ' + version, 'draft': True,
              'prerelease': '-' in version.split('+')[0],
              'body': note + '\n\nTwelve bundles cover six native targets: Linux tar.gz, DEB and RPM built on Ubuntu 24.04, macOS DMG, and Windows EXE/ZIP (x86_64 and aarch64). All targets passed packaged --help smoke checks. DEB passed installation, sample provenance and uninstall user-data preservation checks on its Ubuntu build runner. RPM passed metadata, dependency declaration, payload integrity and relocated execution checks, not Fedora/RHEL/openSUSE installation tests. SHA256SUMS and per-file SHA-256 checksums are included. This draft requires maintainer review before publication.'
          })
          upload_url = release['upload_url'].split('{')[0]
          for name in sorted(expected):
              path = directory / name
              # Stream bundles rather than buffering every large executable in memory.
              with path.open('rb') as stream:
                  req = urllib.request.Request(upload_url + '?name=' + urllib.parse.quote(name, safe=''), data=stream, method='POST', headers=headers | {
                      'Content-Type': 'application/octet-stream', 'Content-Length': str(path.stat().st_size)
                  })
                  with urllib.request.urlopen(req, timeout=600) as response:
                      uploaded = json.load(response)
              if uploaded['state'] != 'uploaded' or uploaded['size'] != path.stat().st_size:
                  raise SystemExit('Incomplete uploaded asset: ' + name)
          uploaded = request(f"{api}/releases/{release['id']}/assets?per_page=100")
          if len(uploaded) != len(expected) or {asset['name'] for asset in uploaded} != expected:
              raise SystemExit('Draft release assets are incomplete; draft was NOT published')
          for asset in uploaded:
              path = directory / asset['name']
              with path.open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if asset['size'] != path.stat().st_size or (asset.get('digest') and asset['digest'] != digest):
                  raise SystemExit('Uploaded asset integrity check failed: ' + asset['name'])
          current = request(f"{api}/releases/{release['id']}")
          if not current['draft']:
              raise SystemExit('Release is unexpectedly public')
          print('Complete draft release: ' + current['html_url'])
          PY
